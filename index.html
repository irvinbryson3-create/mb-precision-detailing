<!DOCTYPE html>
<html>
<head>
  <title>MB Precision Detailing</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    .header {
      text-align: center;
      padding: 60px 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(45deg, #222, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: bold;
      border: 2px solid white;
    }

    h1 {
      margin: 10px 0;
      font-size: 40px;
    }

    .tagline {
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      margin: 10px auto;
      max-width: 400px;
      border-radius: 12px;
    }

    a {
      color: #00bfff;
      text-decoration: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      max-width: 800px;
      margin: auto;
    }

    .img {
      height: 150px;
      background: #333;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">MB</div>
    <h1>MB Precision Detailing</h1>
    <div class="tagline">Premium Car Detailing in Kentucky</div>
  </div>

  <div class="section">
    <h2>Contact</h2>
    <div class="card">
      <p>Bryson: 502-612-6815</p>
      <p>Maddox: 270-866-3229</p>
    </div>
  </div>

  <div class="section">
    <h2>Instagram</h2>
    <div class="card">
      <a href="https://www.instagram.com/mbpercisiondetailing_/" target="_blank">
        Visit Our Instagram
      </a>
    </div>
  </div>

  <div class="section">
    <h2>Our Work</h2>
    <div class="gallery">
      <div class="img"></div>
      <div class="img"></div>
      <div class="img"></div>
    </div>
  </div>

</body>
</html>
